name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version_name: ${{ steps.package.outputs.version_name }}
      release_tag: ${{ steps.package.outputs.release_tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build dependencies
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set increasing Android build version
        run: echo "ANDROID_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Restore preview signing key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          PUBLISHING_BUILD: ${{ github.ref == 'refs/heads/main' }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            signing_keystore="$RUNNER_TEMP/punt-signing.keystore"
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$signing_keystore"
            chmod 600 "$signing_keystore"
            echo "ANDROID_PREVIEW_KEYSTORE=$signing_keystore" >> "$GITHUB_ENV"
          elif [ "$PUBLISHING_BUILD" = "true" ]; then
            echo '::error::Configure ANDROID_DEBUG_KEYSTORE_BASE64 before publishing updatable APKs.'
            exit 1
          else
            echo '::warning::No preview signing key configured. This APK may require uninstalling an existing build before installation.'
          fi

      - name: Run unit tests and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: Build optimized preview APK
        run: ./gradlew --no-daemon :app:assemblePreview

      - name: Verify APK uses the saved signing key
        if: env.ANDROID_PREVIEW_KEYSTORE != ''
        run: |
          bash .github/scripts/verify-apk-signing.sh \
            "$ANDROID_PREVIEW_KEYSTORE" \
            app/build/outputs/apk/preview/app-preview.apk \
            "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Prepare download
        id: package
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/preview/app-preview.apk artifacts/punt.apk
          python3 .github/scripts/package-update.py \
            --metadata app/build/outputs/apk/preview/output-metadata.json \
            --apk artifacts/punt.apk \
            --output artifacts/update.json \
            --release-base-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: punt-apk-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload check reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-check-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish APK to GitHub Releases
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download built APK
        uses: actions/download-artifact@v8
        with:
          name: punt-apk-${{ github.run_number }}
          path: artifacts

      - name: Create release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version_name }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          test -s artifacts/punt.apk
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Release $RELEASE_TAG already exists. Bump versionName to publish a new release."
            exit 0
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Automatically built preview APK from main.

          Commit: ${GITHUB_SHA}
          Build: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Download punt.apk below and install it on your Android device.
          EOF
          gh release create "$RELEASE_TAG" artifacts/punt.apk artifacts/update.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Punt ${RELEASE_VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest
